<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR scenarios – interview prep</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e2e2de;--acc:#0019a5;--accbg:#e9ecfb;--hi:#fff6d6;--hiink:#5c4600;--warn:#fdeceb;--warnink:#8a1c12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header{padding:16px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.printbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.panel h2{font-size:19px;margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tag{font-size:12px;background:var(--accbg);color:var(--acc);border-radius:6px;padding:2px 8px}
.tag.cat{background:transparent;border:1px solid var(--line);color:var(--mute)}
.meta{font-size:13px;color:var(--mute);margin:-2px 0 4px}
.flag{font-size:13px;background:var(--warn);color:var(--warnink);border-radius:8px;padding:6px 10px;margin:8px 0}
.open{background:var(--hi);color:var(--hiink);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.open small,.label{display:block;text-transform:uppercase;font-size:11px;letter-spacing:.07em;margin-bottom:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.num{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.num b{display:block;font-size:18px;color:var(--acc);line-height:1.2}
.num span{font-size:12px;color:var(--mute)}
.sec{margin-top:14px}
.sec h3,.box h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.res{border-left:3px solid var(--acc);padding-left:12px}
.box{margin-top:16px;padding:12px 14px;background:var(--accbg);border-left:3px solid var(--acc);border-radius:10px}
.box p{margin:0}
.qa{margin-top:16px}
.qa h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0 2px}
.rem{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--mute)}
.pick{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.pick th,.pick td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
.pick th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.pick button{border:0;background:none;color:var(--acc);padding:0;font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.nav{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font-size:14px;cursor:pointer}
.nav button:disabled{opacity:.35}
#all{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f0f0f2;--mute:#9a9aa2;--line:#33333a;--acc:#8fa2ff;--accbg:#242a4d;--hi:#3a3216;--hiink:#f3dc8a;--warn:#3d1d1a;--warnink:#ffb4a8}}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#ccc;--acc:#0019a5;--accbg:#eef0fb;--hi:#fff6d6;--hiink:#5c4600}
  .tabs,.nav,#panel,.printbtn,.sub{display:none!important}
  #all{display:block}
  #all .panel{break-inside:auto;break-before:page;border:0;padding:0}
  #all .panel:first-child{break-before:auto}
  details{border:0;padding:0}
  details>*{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>STAR scenarios</h1>

  <div id="all"></div>
  <div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div>
</div>

/* "Which story?" overview: built from the competency areas above */
function pickTable(){
  var areas = {};
  S.forEach(function(x, i){ x.areas.forEach(function(a){ (areas[a] = areas[a] || []).push(i); }); });
  var qs = [
    ["Biggest measurable impact", [0, 2]],
    ["Making sense of a complex system", [1]],
    ["Using data and research to decide", [0, 3]],
    ["Aligning teams without authority", [1, 4, 5]],
    ["Improving how the team works", [2, 5]],
    ["Learning something new", [6]],
    ["Something that went wrong", [0, 5]]
  ];
  function links(ids){ return ids.map(function(i){ return '<button data-go="' + (i + 1) + '">' + S[i].t + '</button>'; }).join(', '); }
  var rows1 = qs.map(function(q){ return '<tr><td>' + q[0] + '</td><td>' + links(q[1]) + '</td></tr>'; }).join('');
  var rows2 = Object.keys(areas).sort().map(function(a){ return '<tr><td>' + a + '</td><td>' + links(areas[a]) + '</td></tr>'; }).join('');
  return '<h2>Which story for which question?</h2>' +
    '<p class="meta">Pick a story, then open its tab. Have the portfolio page ready to share on screen.</p>' +
    '<table class="pick"><tr><th>If they ask about…</th><th>Lead with</th></tr>' + rows1 + '</table>' +
    '<table class="pick" style="margin-top:16px"><tr><th>Competency area</th><th>Stories</th></tr>' + rows2 + '</table>' +
    '<div class="box"><h3>For “something that went wrong”</h3><p>Lead with TV cards: add-to-basket clicks made the winning version look worse and I’d have shipped the wrong one on clicks alone. Every tab also has a “What I’d do differently” answer.</p></div>' +
    '<div class="rem">For every story: say what <b>I</b> did, the outcome with one number, what I learned and why it mattered. Aim for about 2 minutes, then let them ask follow-ups.</div>';
}

var cur = 0, $ = function(i){ return document.getElementById(i); };
function li(a){ return a.map(function(x){ return '<li>' + x + '</li>'; }).join(''); }
function sec(c, h, a){ return '<div class="sec ' + c + '"><h3>' + h + '</h3><ul>' + li(a) + '</ul></div>'; }

function scenario(x){
  return '<div class="tags">' + x.areas.map(function(a){ return '<span class="tag">' + a + '</span>'; }).join('') + x.cats.map(function(a){ return '<span class="tag cat">' + a + '</span>'; }).join('') + '</div>' +
    '<h2>' + x.title + '</h2>' +
    '<p class="meta">' + x.meta + (x.link ? ' · <a href="' + SITE + x.link + '" target="_blank" rel="noopener">Open in portfolio</a>' : '') + '</p>' +
    (x.note ? '<div class="flag">' + x.note + '</div>' : '') +
    '<div class="open"><small>Opening line · 30 seconds</small>' + x.open + '</div>' +
    '<div class="label" style="color:var(--acc);margin-top:14px">Numbers to remember</div>' +
    '<div class="nums">' + x.nums.map(function(n){ return '<div class="num"><b>' + n[0] + '</b><span>' + n[1] + '</span></div>'; }).join('') + '</div>' +
    sec('', 'Situation', x.s) + sec('', 'Task', x.k) + sec('', 'Action', x.a) + sec('res', 'Result', x.r) +
    '<div class="box"><h3>What I’d do differently</h3><p>' + x.d + '</p></div>' +
    '<div class="qa"><h3>Likely follow-ups</h3>' + x.q.map(function(q){ return '<details><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('') + '</div>';
}

var tabs = ['Which story?'].concat(S.map(function(x, i){ return (i + 1) + '. ' + x.t; }));

function renderTabs(){
  $('tabs').innerHTML = tabs.map(function(t, i){ return '<button class="tab" role="tab" aria-selected="' + (i === cur) + '" data-i="' + i + '">' + t + '</button>'; }).join('');
}
function render(){
  $('panel').innerHTML = cur === 0 ? pickTable() : scenario(S[cur - 1]);
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === tabs.length - 1;
  renderTabs();
  document.querySelector('.tab[aria-selected="true"]').scrollIntoView({ inline: 'center', block: 'nearest' });
}
function go(i){ if (i < 0 || i >= tabs.length) return; cur = i; render(); window.scrollTo(0, 0); }

$('tabs').onclick = function(e){ var b = e.target.closest('.tab'); if (b) go(+b.dataset.i); };
$('panel').onclick = function(e){ var b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); };
$('prev').onclick = function(){ go(cur - 1); };
$('next').onclick = function(){ go(cur + 1); };
document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });

/* Print all: every scenario on its own page, follow-ups expanded */
$('all').innerHTML = S.map(function(x){ return '<section class="panel">' + scenario(x) + '</section>'; }).join('');
$('all').querySelectorAll('details').forEach(function(d){ d.open = true; });
$('print').onclick = function(){ window.print(); };

render();
</script>
</body>
</html>
